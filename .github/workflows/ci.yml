# Robô de qualidade: a cada envio (push) ou pull request na main,
# o GitHub instala o projeto do zero e roda todas as verificações.
# Se alguma falhar, aparece um ❌ no GitHub.
name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Se chegar um envio novo, cancela a verificação antiga do mesmo ramo
concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Um banco de dados Postgres descartável, só para os testes do robô.
    # Ele nasce vazio a cada execução e some no fim: nunca toca nos dados reais.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalogo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # O token vem dos "Secrets" do repositório; nunca aparece nos registros
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      CI: true
      # Valores só de teste (o banco acima e um login falso); não são segredos de verdade
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/catalogo
      BETTER_AUTH_SECRET: segredo-so-para-os-testes-do-robo-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: teste
      GOOGLE_CLIENT_SECRET: teste
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Procurar problemas no código (lint)
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Montar a versão de produção (build)
        run: npm run build

      - name: Instalar o navegador do robô
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Guardar o relatório do Playwright se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: test-results/
          retention-days: 7
